version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sumexora-postgres
    environment:
      POSTGRES_USER: sumexora
      POSTGRES_PASSWORD: sumexora_secret
      POSTGRES_DB: sumexora_penal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumexora -d sumexora_penal"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sumexora-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sumexora
      MINIO_ROOT_PASSWORD: sumexora_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
